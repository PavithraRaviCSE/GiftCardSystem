<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>Login</title>

	
<link rel="stylesheet" href="css/form-table.css">
<style>
.form-container{


margin-top:200px;
}

</style>
</head>


<body>

<center>

	<div class="form-container">
		
		<form id="loginForm">
		<h2>Login</h2>
			<label for="userId">User Id</label><br> 
			<input type="number" id="userId" placeholder="enter your user id" required><br><br> 
			<label for="password">password</label><br>
			<input type="password" id="password" placeholder="Password" required><br><br>
			<button type="submit">Submit</button><br><br>
			<a href="Purchase">purchase ? </a>
		</form>
	</div>
	
</center>



	<script src="https://cdn.jsdelivr.net/npm/jwt-decode@3.1.2/build/jwt-decode.min.js"></script>

	<script>
	
	document.getElementById("loginForm").addEventListener("submit", async function(event) {
	    event.preventDefault();

	    const userId = document.getElementById("userId").value;
	    const password = document.getElementById("password").value;

	    const formData = new URLSearchParams();
	    formData.append("userId", userId);
	    formData.append("password", password);
	    try {
	        const response = await fetch("http://localhost:8080/GiftCardSystem/login", {
	            method: "POST",
	            headers: {
	                "Content-Type": "application/x-www-form-urlencoded",
	            },
	            body: formData
	        });

	        if (!response.ok) {
	            throw new Error(`HTTP error! Status: ${response.status}`);
	        }

	        const responseText = await response.text();
	        console.log("Raw Response:", responseText);
	        let data;
	        
	        try {
	            data = JSON.parse(responseText);
	        } catch (jsonError) {
	            console.error("JSON Parsing Error:", jsonError);
	            return;
	        }

	        console.log("Parsed Data:", data);

	        if (data.token) {
	            const token = data.token;
	            sessionStorage.setItem("token", token);
	            console.log("Token saved in sessionStorage:", token);

	            try {
	                const decodedToken = jwt_decode(token);
	                console.log("Decoded Token:", decodedToken);


		            sessionStorage.setItem("decodedToken", JSON.stringify(decodedToken));

	                const userType = decodedToken.userType;
	                console.log(sessionStorage.getItem(decodedToken));

	                 if (userType === 'admin') {
	                	
	                    window.location.href = "AdminHome";
	                } 
	                else if (userType === 'user') {
	                	
	                    window.location.href = "UserHome";
	                }  
	                else {
	                	alert("user and admin only allowed");
	                    window.location.href = "Login";
	                }  
	            } catch (error) {
	                console.error("Error decoding token:" + error);
	                alert("Invalid login credentials!!!try again later");
	            } 
	        } else {
	        	console.error(data.error);
	            alert("Invalid login credentials");
	        }

	    } catch (error) {
	        console.error("Error:" +  error);
	        alert("Invalid login credentials");
	    }
	});
	</script>

</body>
</html>
