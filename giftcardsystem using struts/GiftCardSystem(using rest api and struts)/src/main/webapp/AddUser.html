<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>


<link rel="stylesheet" href="css/headerStyle.css">


<link rel="stylesheet" href="css/tableStyle.css">

<link rel="stylesheet" href="css/form-table.css">
</head>

<body>

	<div class="header">
		<div class="nav-links">
			<a href="AdminHome" class="nav-link">home</a> <a href="AddUser"
				class="nav-link">CreateUser</a> <a href="ViewUser" class="nav-link">ViewUser</a>
			<a href="SearchUser" class="nav-link">SearchUser</a> <a
				href="CreditUser" class="nav-link">Credit</a> <a href="#"
				onclick="logout()">Logout</a>
		</div>
	</div>

	<div class="main-container">
		<div class="form-container">
			<form id="addUserForm">
				<label for="userName">User Name</label> <br> <input type="text"
					id="userName" placeholder="Enter name" required> <br>
				<label for="dob">DOB</label><br> <input type="date" id="dob"
					required><br> <label for="userType">User Type</label><br>
				<select id="userType">
					<option value="user">User</option>
					<option value="admin">Admin</option>
				</select> <br> <label for="amount">Amount</label> <br> <input
					type="number" min="100" id="amount" placeholder="10000" required>
				<br> <label for="mobile">Mobile</label><br> <input
					type="text" id="mobile" placeholder="1234567890" required>
				<br> <span id="message"></span><br>
				<button type="submit">submit</button>
			</form>




		</div>
		<div class="table-container">
			<table id="userTableBody">
				<thead>
					<tr>
						<th>Account Number</th>
						<th>User Name</th>
						<th>User Type</th>
						<th>Balance</th>
						<th>DOB</th>
						<th>Mobile</th>

					</tr>
				</thead>
				<tbody>
				</tbody>
			</table>

		</div>

	</div>
	<script type="text/javascript" src="js/script.js"></script>

	<script>
	async function fun(){

		await validateToken();
		
	}
    window.onload = fun;

	  
	document.getElementById("addUserForm").addEventListener("submit", async function(event) {
	    event.preventDefault();
	    
	    await validateToken();
		
			     let userName = document.getElementById("userName").value;
			     let dob = document.getElementById("dob").value;
			     let userType = document.getElementById("userType").value;
			     let amount = document.getElementById("amount").value;
			     let mobile = document.getElementById("mobile").value; 
			     console.log("userName:" + userName);

			// const formData = new FormData();
			const formData = new URLSearchParams();
			formData.append("userName", userName);
			formData.append("dob", dob);
			formData.append("userType", userType);
			formData.append("amount", amount);
			formData.append("mobile", mobile);  

			try {
				/* http://localhost:8080/GiftCardSystem/login */
			   const token = sessionStorage.getItem("token");

				const response = await
				fetch("http://localhost:8080/GiftCardSystem/admin/users", {
					method : "POST",
					 headers: {
						 "Authorization": "Bearer " + token,
			                "Content-Type": "application/x-www-form-urlencoded",
			                
			            },
					body : formData
				});

				if (!response.ok) {
					
					if(response.status === 403)
						alert("accessdenied: admin only");
					window.location.href = "UserHome";
					message.innerText = "Cannot add user Try again";
					console.log("User is not added");
					return;
				}

				const data = await response.json();
				console.log("User added:", data);
				
				if(data.user){
					
					alert(data.success);
					showUser(data.user);
					const message = document.getElementById("message");
					var form = document.getElementById("addUserForm");
		            form.reset();
		            message.innerText = "";
				
				}
				else{
					const message = document.getElementById("message");
					message.innerText = data.error;
					
				}
				
			} catch (error) {
				console.error("Error happened:", error);
			}
	});
	
	function showUser(user){
		
		let tableBody = document.getElementById("userTableBody");

		  let row = `<tr>
		        <td>${user.accountNumber}</td>
		        <td>${user.userName}</td>
		        <td>${user.userType}</td>
		        <td>${user.balance}</td>
		        <td>${user.dob.dayOfMonth} ${user.dob.month} ${user.dob.year}</td>
		        <td>${user.mobile}</td>
		    </tr>`;

		    tableBody.innerHTML += row;
		
	}


	</script>

</body>
</html>
