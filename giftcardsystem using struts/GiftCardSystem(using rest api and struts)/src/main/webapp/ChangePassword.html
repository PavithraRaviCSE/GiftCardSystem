<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password</title>
</head>




<link rel="stylesheet" href="css/headerStyle.css">

<link rel="stylesheet" href="css/form-table.css">

<body>

	<div class="header">
		<div class="nav-links">
			<a href="UserHome" class="nav-link">home</a>
			<a href="PurchaseChart" class="nav-link">chart</a> <a href="CreateCard" class="nav-link">Create
				Gift Card</a> <a href="ViewCard" class="nav-link">View Cards</a> <a
				href="ViewTransaction" class="nav-link">View Card Transactions</a> <a
				href="TopUpCard" class="nav-link">Top-Up Card</a> <a href="BlockCard" class="nav-link">Block
				Card</a> <a href="ChangePassword" class="nav-link">Change Password</a><a href="#" onclick="logout()">Logout</a>
		</div>
	</div>
	<div class="form-container">
		<form onsubmit="changePassword(event)" id= "changePass">
			<label for="currentPassword">Current Password</label> <br> <input
				type="password" name="currentPassword" id="currentPassword" required><br>

			<label for="newPassword">New Password</label> <br><input type="password"
				name="newPassword" id="newPassword" required> <br><label
				for="confirmPassword">Confirm New Password</label><br> <input
				type="password" name="confirmPassword" id="confirmPassword" required><br>

			<button type="submit">Submit</button>
		</form>

		<div id="message" class="message"></div>
	</div>



	<script type="text/javascript" src="js/userScript.js"></script>

	<script>

	async function fun(){

		await validateToken();
		
	}



    window.onload = fun;
	
	
		async function changePassword(event) {
			event.preventDefault();
			
			await validateToken();

			let currentPassword = document.getElementById("currentPassword").value;
			let newPassword = document.getElementById("newPassword").value;
			let confirmPassword = document.getElementById("confirmPassword").value;

			if (newPassword !== confirmPassword) {

				alert("confirm password not matched...");
				return;
			}

			const formData = new URLSearchParams();/* 
			formData.append("currentPassword", currentPassword); */
			formData.append("newPassword", newPassword);

			console.log(formData);
			try {

			    const token = sessionStorage.getItem("token");
				const response = await
				fetch(
						`http://localhost:8080/GiftCardSystem/user/changePassword/${currentPassword}`,
						{
							method : "PUT",
						    headers: {
						    	  "Content-Type": "application/x-www-form-urlencoded",
				                "Authorization": "Bearer " + token
				            },
							body : formData
						});

				if (!response.ok) {
					throw new Error(`HTTP error! Status: ${response.status}`);
				}

				const data = await response.json(); // Assuming server returns JSON

				console.log(data);
				if (data.success) {
					alert(data.success);
					 var form = document.getElementById("changePass");
			            form.reset();
				} else {
					alert(data.error);
				}

			} catch (error) {
				console.error("Error:", error);
				alert(error);
			}
		}

		
	
	</script>

</body>

</html>
