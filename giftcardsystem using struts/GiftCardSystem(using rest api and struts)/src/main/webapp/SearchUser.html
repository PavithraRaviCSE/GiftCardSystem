<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Insert title here</title>

<link rel="stylesheet" href="css/headerStyle.css">

<link rel="stylesheet" href="css/tableStyle.css">

<link rel="stylesheet" href="css/form-table.css">
</head>


<body>

	<div class="header">
		<div class="nav-links">
			<a href="AdminHome" class="nav-link">home</a>
			<a href="PurchaseChart" class="nav-link">chart</a> <a href="AddUser"
				class="nav-link">CreateUser</a> <a href="ViewUser" class="nav-link">ViewUser</a>
			<a href="SearchUser" class="nav-link">SearchUser</a> <a
				href="CreditUser" class="nav-link">Credit</a> <a href="#"
				onclick="logout()">Logout</a>
		</div>
	</div>

	<div class="main-container">
		<div class="form-container">

			<form id="searchUserForm">
				<label for="userData">Enter account number or name</label> <br>
				<input type="text" name="userData" id="userData"><br> <select
					name="type" id="type">
					<option value="accountNumber">accountNumber</option>
					<option value="name">name</option>
				</select><br>
				<button type="submit">search</button>
			</form>

		</div>


		<div class="table-container">
			<table id="userTableBody">
				<thead>
					<tr>
						<th>Account Number</th>
						<th>User Name</th>
						<th>User Type</th>
						<th>Balance</th>
						<th>DOB</th>
						<th>Mobile</th>

					</tr>
				</thead>
				<tbody>
				</tbody>
			</table>

		</div>
	</div>

	<script type="text/javascript" src="js/script.js"></script>
	<script>
	

	async function fun(){
		await validateToken();
	}
	

	window.onload = fun;


        document.getElementById("searchUserForm").addEventListener("submit", async function (event) {
            event.preventDefault();



			await validateToken();
            const userData = document.getElementById("userData").value;
            const type = document.getElementById("type").value;

            const token = sessionStorage.getItem("token");

            try{
             const response = await fetch(`http://localhost:8080/GiftCardSystem/admin/users/${userData}?type=${type}`, {
             method: "GET",
             headers: {
                 "Authorization": "Bearer " + token
             }
         });


                if (!response.ok) {
                    console.error("error");
                    return;
                }

                const data = await response.json();
                console.log(data);
                

                if (data.userList) {
                    showUser(data);
                }
                
            } catch (error) {
                console.error("Error in fetching user:", error);
            }

        });
        function showUser(response) {
            let tableBody = document.getElementById("userTableBody").querySelector("tbody");
            tableBody.innerHTML = ""; // Clear previous data

            response.userList.forEach(user => {
                let row = `<tr>
                    <td>${user.accountNumber}</td>
                    <td>${user.userName}</td>
                    <td>${user.userType}</td>
                    <td>${user.balance}</td>
                    <td>${user.dob.dayOfMonth} ${user.dob.month} ${user.dob.year}</td>
                    <td>${user.mobile}</td>
                </tr>`;
                tableBody.innerHTML += row;
            });
        }

    </script>

</body>

</html>
