<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>View Gift Cards</title>

<link rel="stylesheet" href="css/headerStyle.css">

<link rel="stylesheet" href="css/tableStyle.css">

</head>
<body>

	<div class="header">
		<div class="nav-links">
			<a href="UserHome" class="nav-link">home</a>
			<a href="PurchaseChart" class="nav-link">chart</a> <a href="CreateCard" class="nav-link">Create
				Gift Card</a> <a href="ViewCard" class="nav-link">View Cards</a> <a
				href="ViewTransaction" class="nav-link">View Card Transactions</a> <a
				href="TopUpCard" class="nav-link">Top-Up Card</a> <a href="BlockCard" class="nav-link">Block
				Card</a> <a href="ChangePassword" class="nav-link">Change Password</a><a href="#" onclick="logout()">Logout</a>
		</div>
	</div>
	

<div class = "table-container">

	<table id="giftCardTable">
		<thead>
			<tr>
				<th>Gift Card ID</th>
				<th>Gift Card Number</th>
				<th>Pin</th>
				<th>User ID</th>
				<th>Balance</th>
				<th>Status</th>
				<th>Reward Points</th>
				<th>Created At</th>
			</tr>
		</thead>
		<tbody>
			<!-- Data will be populated here -->
		</tbody>
	</table>
</div>



<script type="text/javascript" src="js/userScript.js"></script>
	<script>
	
	

    window.onload = fetchGiftCardData;
	

async function fetchGiftCardData() {
	await validateToken();
    try {
    	const  token = sessionStorage.getItem("token");
    	console.log(token);
        const response = await fetch("http://localhost:8080/GiftCardSystem/user/cards", {
            method: "GET",
            headers: {
                "Authorization": "Bearer " + token
            }
        });

        if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
        }

        const data = await response.json();
        console.log("Fetched Data:", data);

        if (data.giftCardList) {
            populateTable(data.giftCardList);
        } else {
        	alert("no card available");
            console.error("No gift card data available");
        }
    } catch (error) {
        console.error("Error fetching gift card data:"+ error);
    }
}

function populateTable(data) {
    const tableBody = document.getElementById('giftCardTable').querySelector('tbody');
    tableBody.innerHTML = ''; 
    data.forEach(giftCard => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${giftCard.giftCardId}</td>
            <td>${giftCard.giftCardNumber}</td>
            <td>${giftCard.pin}</td>
            <td>${giftCard.userId}</td>
            <td>${giftCard.balance}</td>
            <td>${giftCard.status}</td>
            <td>${giftCard.rewardPoints}</td>
            <td>${giftCard.createdAt}</td>
        `;
        tableBody.appendChild(row);
    });
}

</script>

</body>
</html>
