<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>

<link rel="stylesheet" href="css/headerStyle.css">

<link rel="stylesheet" href="css/form-table.css">
</head>



<body>

	<div class="header">
		<div class="nav-links">
			<a href="UserHome" class="nav-link">home</a>
			<a href="PurchaseChart" class="nav-link">chart</a> <a href="CreateCard"
				class="nav-link">Create Gift Card</a> <a href="ViewCard"
				class="nav-link">View Cards</a> <a href="ViewTransaction"
				class="nav-link">View Card Transactions</a> <a href="TopUpCard"
				class="nav-link">Top-Up Card</a> <a href="BlockCard"
				class="nav-link">Block Card</a> <a href="ChangePassword"
				class="nav-link">Change Password</a><a href="#" onclick="logout()">Logout</a>
		</div>
	</div>


		<div class="form-container">


			<form id="createCard">
				<label for="amount">Amount</label> <br> <input type="number"
					name="amount" id="amount" min="50" required> <br> <label for="pin">Pin</label> <br>
				<input type="number" min="1000"  max = "9999" name="pin" id="pin" required> <br>
				<button type="submit">Submit</button>
			</form>

		<!-- 	<div class="output"></div> -->

		</div>




	<script type="text/javascript" src="js/userScript.js"></script>

	<script>

	async function fun(){

		await validateToken();
		
	}



    window.onload = fun;
	
	document.getElementById("createCard").addEventListener("submit", async function(event) {
	    event.preventDefault(); 

	    await validateToken;
	    let amount = document.getElementById("amount");
	    let pin = document.getElementById("pin");

	    const formData = new URLSearchParams();
	    formData.append("amount", amount.value);
	    formData.append("pin", pin.value);

	    try {
	        const token = sessionStorage.getItem("token");
	        const response = await fetch("http://localhost:8080/GiftCardSystem/user/cards", {
	            method: "POST",
	            headers: {
	                "Authorization": "Bearer " + token,
	                "Content-Type": "application/x-www-form-urlencoded"
	            },
	            body: formData
	        });

	        if (!response.ok) {
	            throw new Error(`HTTP error! Status: ${response.status}`);
	        }

	        const data = await response.json();

	        if(data != null){
	        	if(data.cardNumber){
	            /* document.querySelector(".output").innerHTML = "Card Number: " + data.response.cardNumber  ; */
	            alert("card created successfully!!!    card number: " + data.cardNumber);
	            var form = document.getElementById("createCard");
	            form.reset();
	        }
	        	else{
	        	/* document.querySelector(".output").innerHTML =  data.response.error ; */
	        		alert("cannot create card,  error: " + data.error);
	        	}
	        }
	        
	    } catch (error) {
	        console.error("Error:" +  error);
	    }
	});

	function output(data) {
	    const outputDiv = document.querySelector(".output");
	    outputDiv.innerHTML = `
	        <h2>Card Created Successfully</h2>
	        <p><strong>Card Number:</strong> ${data.response.cardNumber}</p>
	        <p><strong>Amount:</strong> ${data.response.amount}</p>
	        <p><strong>Pin:</strong> ${data.response.pin}</p>
	    `;
	}

        </script>

</body>

</html>
