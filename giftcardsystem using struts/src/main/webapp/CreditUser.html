<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Credit Amount</title>

<link rel="stylesheet" href="css/headerStyle.css">

<link rel="stylesheet" href="css/tableStyle.css">

<link rel="stylesheet" href="css/form-table.css">
</head>

<body>
	<div class="header">
		<div class="nav-links">
			<a href="AdminHome" class="nav-link">home</a> <a href="AddUser"
				class="nav-link">CreateUser</a> <a href="ViewUser" class="nav-link">ViewUser</a>
			<a href="SearchUser" class="nav-link">SearchUser</a> <a
				href="CreditUser" class="nav-link">Credit</a> <a href="#"
				onclick="logout()">Logout</a>
		</div>
	</div>

	<div class="main-container">

		<div class="form-container">
			<form id="creditAmountForm">
				<label for="accountNumber">Account Number</label> <br><input type="text"
					id="accountNumber" required><br>
				<button onclick="search(event)">search</button><br>

				<label for="amount">Amount</label> <br><input type="number" min="1" id="amount"
					required><br>

				<button type="submit">Submit</button>
			</form>

			<p id="responseMessage"></p>
		</div>
		<div class="table-container">

			<table id="userTable">
				<thead>
					<tr>
						<th>Account Number</th>
						<th>User Name</th>
						<th>User Type</th>
						<th>Balance</th>
						<th>DOB</th>
						<th>Mobile</th>
					</tr>
				</thead>
				<tbody>
				</tbody>
			</table>

		</div>

	</div>
	<script type="text/javascript" src="js/script.js"></script>
	<script>
	
	async function fun(){

		await validateToken();
		
	}



    window.onload = fun;

	async function search(event) {
	    event.preventDefault(); // Prevent page reload


		await validateToken();
	    const accountNumber = document.getElementById("accountNumber").value.trim();
	    if (!accountNumber) {
	        alert("Please enter an account number.");
	        return;
	    }

	    try {
	        const token = sessionStorage.getItem("token");

	        const response = await fetch(`http://localhost:8080/GiftCardSystem/admin/users/${accountNumber}?type=accountNumber`, {
	            method: "GET",
	            headers: {
	               
	                "Authorization": "Bearer " + token
	            }
	        });

	        if (!response.ok) {
	            throw new Error(`HTTP error! Status: ${response.status}`);
	        }

	        const data = await response.json();
	        console.log("User Data:", data);

	        if (data.userList != null) {
	            showUser(data.userList[0]);
	        } else {
	            alert("No user found with this account number.");
	        }
	    } catch (error) {
	        console.error("Error in fetching user:", error);
	    }
	}

	function showUser(user) {
	    let tableBody = document.getElementById("userTable").querySelector("tbody");
	    tableBody.innerHTML = `
	        <tr>
	            <td>${user.accountNumber}</td>
	            <td>${user.userName}</td>
	            <td>${user.userType}</td>
	            <td>${user.balance}</td>
	            <td>${user.dob?.dayOfMonth} ${user.dob?.month} ${user.dob?.year}</td>
	            <td>${user.mobile}</td>
	        </tr>
	    `;
	}

	document.getElementById("creditAmountForm").addEventListener("submit", async function (event) {
	    event.preventDefault();

	    const accountNumber = document.getElementById("accountNumber");
	    const amount = document.getElementById("amount");
	    const responseMessage = document.getElementById("responseMessage");

	    const formData = new URLSearchParams();/* 
	    formData.append("accountNumber", accountNumber.value.trim()); */
	    formData.append("amount", amount.value.trim());

	    try {
	        const token = sessionStorage.getItem("token");

	        const response = await fetch(`http://localhost:8080/GiftCardSystem/admin/users/${accountNumber.value.trim()}`, {
	            method: "PUT",
	            headers: {
	                "Content-Type": "application/x-www-form-urlencoded",
	                "Authorization": "Bearer " + token
	            },
	            body: formData
	        });

	        const data = await response.json();
	        console.log("Response:", data);/* 
	        responseMessage.innerText = data.response.success || data.response.error; */
	        alert(data.success ||  data.error);
	        if(data.success){
	        	
	        	accountNumber.innerValue = "";
	        	amount.innerValue ="";
	        	search(event);
	        }
	        
	        
	    } catch (error) {
	        console.error("Error in crediting amount:", error);/* 
	        responseMessage.innerText = "Try again!"; */
	    }
	});
	
	

	

	</script>

</body>
</html>
